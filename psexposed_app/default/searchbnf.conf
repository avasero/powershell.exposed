[psexposed-command]
syntax = psexposed (field=<string>)? (rate_limit_delay=<float>)?
alias =
shortdesc = Analyze PowerShell commands using the powershell.exposed API.
description = \
    Sends the PowerShell command in the specified field to the powershell.exposed \
    API for analysis. Returns risk level, MITRE ATT&CK techniques, deobfuscated \
    output, and an AI-generated summary. Each user must configure their own API \
    key via the app setup page.
comment1 = \
    Example 1: Analyze a single command \
    | makeresults | eval ps_command="IEX ..." | psexposed field=ps_command
comment2 = \
    Example 2: Analyze PowerShell ScriptBlock logs \
    index=windows EventCode=4104 | psexposed field=ScriptBlockText
usage = public
appears-in = streaming
tags = powershell analysis security deobfuscation

[psexposed-command-options]
syntax = field=<string> rate_limit_delay=<float>
description = \
    field: The event field containing the PowerShell command to analyze (default: ps_command). \
    rate_limit_delay: Seconds to wait between API calls (default: 0.2).
