name: Validate Indicators (Pull Request)

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'indicators/**/*.yaml'
      - 'indicators/**/*.yml'

jobs:
  # ============================================================================
  # STEP 1: Detect Changed Files in PR
  # ============================================================================
  detect-changes:
    name: "Step 1: Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check-changes.outputs.has_changes }}
      changed-files: ${{ steps.check-changes.outputs.changed_files }}
      total-files: ${{ steps.check-changes.outputs.total_files }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed indicator files
        id: check-changes
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         PULL REQUEST VALIDATION - STEP 1: DETECT             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          
          # Get files changed in this PR
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "📊 Comparing: $BASE_SHA...$HEAD_SHA"
          echo ""
          
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'indicators/*.yaml' 'indicators/*.yml' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changed_files=[]" >> $GITHUB_OUTPUT
            echo "total_files=0" >> $GITHUB_OUTPUT
            echo "ℹ️ No indicator files changed in this PR"
          else
            TOTAL=$(echo "$CHANGED_FILES" | wc -l)
            echo "📁 Changed indicator files ($TOTAL):"
            echo "$CHANGED_FILES" | sed 's/^/   • /'
            echo ""
            
            # Convert to JSON array (compact, single line)
            CHANGED_JSON=$(echo "$CHANGED_FILES" | jq -R -c . | jq -s -c '.')
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files=$CHANGED_JSON" >> $GITHUB_OUTPUT
            echo "total_files=$TOTAL" >> $GITHUB_OUTPUT
            
            echo "✅ Found $TOTAL indicator file(s) to validate"
          fi

  # ============================================================================
  # STEP 2-5: Validate All Changed Indicators
  # ============================================================================
  validate-indicators:
    name: "Step 2-5: Validate Indicators"
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Validation Pipeline
        id: validate
        env:
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed-files }}
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         PULL REQUEST VALIDATION - STEPS 2-5                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          
          # Run validation script
          deno run --allow-read --allow-write --allow-env \
            scripts/validate-indicators.ts \
            $(echo "$CHANGED_FILES" | jq -r '.[]')

      - name: Post Success Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const total = ${{ needs.detect-changes.outputs.total-files }};
            const body = `## ✅ Indicator Validation Passed
            
            All **${total}** indicator file(s) passed validation!
            
            | Step | Status |
            |------|--------|
            | YAML Syntax | ✅ Pass |
            | Required Fields | ✅ Pass |
            | Data Types | ✅ Pass |
            | Regex Patterns | ✅ Pass |
            | Business Rules | ✅ Pass |
            
            This PR is ready to be merged.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Post Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ❌ Indicator Validation Failed
            
            One or more indicator files failed validation.
            
            **Please check the workflow logs for details:**
            [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Common issues:
            - Missing required fields (name, description, regex, basescore, tactic, technique, reference)
            - Invalid regex patterns
            - Wrong data types
            
            📖 See [CONTRIBUTING.md](../blob/main/indicators/CONTRIBUTING.md) for the correct format.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================================
  # Summary Check
  # ============================================================================
  validation-summary:
    name: "PR Validation Status"
    needs: [detect-changes, validate-indicators]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Results
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              PULL REQUEST VALIDATION SUMMARY                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          
          if [ "${{ needs.detect-changes.outputs.has-changes }}" != "true" ]; then
            echo "ℹ️ No indicator files changed - nothing to validate"
            exit 0
          fi
          
          echo "📋 Validation Results:"
          echo "   • Detect Changes: ${{ needs.detect-changes.result }}"
          echo "   • Validate:       ${{ needs.validate-indicators.result }}"
          echo ""
          
          if [ "${{ needs.validate-indicators.result }}" == "success" ]; then
            echo "✅ ALL VALIDATIONS PASSED"
            echo "   This PR can be safely merged."
          elif [ "${{ needs.validate-indicators.result }}" == "failure" ]; then
            echo "❌ VALIDATION FAILED"
            echo "   Please fix the errors before merging."
            exit 1
          else
            echo "⚠️ Validation was skipped or cancelled"
          fi
