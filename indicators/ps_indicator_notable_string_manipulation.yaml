name: Notable string manipulation
description: Detects common PowerShell string and byte manipulation patterns (e.g., [char] casting, Convert, Substring, Join, XOR) that are frequently used for obfuscation, deobfuscation, or staged payload construction.
regex: (convert|byte|length|xor|substring|join|toint|tostr).*\[char|\[char.*(convert|byte|length|xor|substring|join|toint|tostr)
basescore: 8
tactic: [TA0005]
technique: [T1027, T1140]
reference:
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1140/
