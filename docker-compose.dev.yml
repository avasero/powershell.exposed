# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  ast-service:
    # Mount source files for live reload during development
    volumes:
      - ./ast-service/scripts:/app/scripts:ro
      - ./ast-service/server.ps1:/app/server.ps1:ro
    # Expose port for direct testing
    ports:
      - "8081:8081"
    # Remove read-only for easier debugging
    read_only: false
    # Development environment
    environment:
      - MAX_INPUT_LENGTH=100000
      - TIMEOUT_SECONDS=30
      - MAX_ITERATIONS=10
      - AST_API_KEY=dev-local-key-12345
      - PORT=8081
    # Remove resource limits for development
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
