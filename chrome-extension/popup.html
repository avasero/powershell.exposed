<!DOCTYPE html>
<html>
<head>
  <title>PowerShell.exposed Settings</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0a0a;
      color: #e0e0e0;
    }
    h2 {
      margin-top: 0;
      color: #1CC76D;
      font-size: 18px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #a0a0a0;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #333;
      background-color: #1a1a1a;
      color: white;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #1CC76D;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #159c55;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 15px;
    }
    .success { color: #1CC76D; }
    .error { color: #ff4444; }
  </style>
</head>
<body>
  <h2>PowerShell.exposed</h2>
  <div class="form-group">
    <label for="apiKey">API Key</label>
    <input type="text" id="apiKey" placeholder="pse_..." />
  </div>
  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
